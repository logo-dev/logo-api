name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# The registry job only reads the repo, so the GITHUB_TOKEN needs nothing more.
# Set at the top level so any job added later inherits least privilege.
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build registry
        run: pnpm build
      - name: Built registry output must be committed and in sync
        run: git diff --exit-code r/
      - name: Validate registry
        run: pnpm validate
      # Dry-run `shadcn add` of every item from this commit's r/, served on
      # localhost, so an unresolvable dependency fails here and not for a
      # customer.
      - name: Install every item (Radix project)
        run: pnpm smoke
      - name: Install every item (Base UI project)
        run: pnpm smoke
        env:
          STYLE: base-nova

  # After a merge, install through the public GitHub form customers use. A
  # #ref does not carry to dependencies (they resolve from main), so this
  # only tests the commit under test once it is main.
  install-from-github:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install every item from logo-dev/logo-api (Radix project)
        run: scripts/smoke-install.sh github "$GITHUB_SHA"
      - name: Install every item from logo-dev/logo-api (Base UI project)
        run: scripts/smoke-install.sh github "$GITHUB_SHA"
        env:
          STYLE: base-nova
